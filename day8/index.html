<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<style>
    *{
        margin: 0;
        

    }
    .box {
  background: url('https://images.unsplash.com/photo-1535868463750-c78d9543614f?q=80&w=2076&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center/cover;
  padding: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 400px;
}

.card {
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(5px);
  height: 80vh;
  width: 25vw;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 40px;
}

.card i{
    font-size: 150px;
    color: white;
}

.card input{
width: 70%;
padding: 10px 20px;
font-size: 20px;
border: none;
border-radius: 8px;
}
</style>
<body>
<div class="box">
    <div class="card">
        <i class="fa-regular fa-user"></i>
        <input type="text" placeholder="Name Here">
        <input type="text" placeholder="Email Here">
        <input type="password" placeholder="Password Here">
    </div>
</div>
</body>
</html>
